<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OCR Clipper</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <header>
    <strong>OCR Clipper</strong>
    <span id="hostStatus" class="pill" title="本机 host 连接状态">host: 未检测</span>
  </header>

  <nav class="tabs">
    <button data-tab="capture" class="active">采集</button>
    <button data-tab="results">结果 <span id="pageCount">0</span></button>
    <button data-tab="settings">设置</button>
  </nav>

  <!-- 采集 -->
  <section id="tab-capture" class="tab active">
    <div class="field">
      <label>模式</label>
      <div class="seg" id="modeSeg">
        <label><input type="radio" name="mode" value="single" /> 当前页面截屏 → OCR</label>
        <label><input type="radio" name="mode" value="continuous" /> 连续翻页截屏 → OCR</label>
      </div>
    </div>

    <div class="field">
      <label for="screenshotTool">截屏工具</label>
      <select id="screenshotTool" data-key="screenshotTool"></select>
      <small class="hint" id="toolHint"></small>
    </div>

    <div class="continuous-only">
      <div class="field">
        <label for="continuousCapture">连续模式截屏方式</label>
        <select id="continuousCapture" data-key="continuousCapture">
          <option value="system-region">系统静默截取浏览器视口（自动，可滚动拼接）</option>
          <option value="browser">浏览器内置截取（自动，可滚动拼接）</option>
          <option value="interactive">每页调用上面的截屏工具手动框选</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label for="maxPages">最多页数</label>
          <input id="maxPages" data-key="maxPages" type="number" min="1" max="2000" />
        </div>
        <div class="field">
          <label for="settleMs">翻页后等待 (ms)</label>
          <input id="settleMs" data-key="settleMs" type="number" min="0" step="100" />
        </div>
      </div>
      <div class="field">
        <label for="nextStrategy">下一页识别</label>
        <select id="nextStrategy" data-key="nextStrategy">
          <option value="auto">自动：规则匹配，失败时交给智能体判断</option>
          <option value="agent">仅智能体判断（截图 + 候选元素）</option>
          <option value="selector">指定 CSS 选择器</option>
          <option value="key">模拟按键（如 ArrowRight）</option>
        </select>
      </div>
      <div class="field strategy-selector">
        <label for="nextSelector">下一页按钮选择器</label>
        <input id="nextSelector" data-key="nextSelector" placeholder="例如 a.next, #btnNext" />
      </div>
      <div class="field strategy-key">
        <label for="nextKey">按键</label>
        <input id="nextKey" data-key="nextKey" placeholder="ArrowRight / PageDown / Space / n" />
      </div>
    </div>

    <label class="check"><input type="checkbox" data-key="scrollCapture" /> 滚动截取整页长图（仅静默截屏方式）</label>

    <div class="actions">
      <button id="startBtn" class="primary">开始</button>
      <button id="stopBtn" disabled>停止</button>
    </div>

    <div class="field">
      <label>日志</label>
      <ol id="log"></ol>
    </div>
  </section>

  <!-- 结果 -->
  <section id="tab-results" class="tab">
    <div class="row">
      <div class="field"><label for="bookTitle">书名</label><input id="bookTitle" data-key="bookTitle" placeholder="默认取第一个标题" /></div>
      <div class="field"><label for="bookAuthor">作者</label><input id="bookAuthor" data-key="bookAuthor" /></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="exportFormat">导出格式</label>
        <select id="exportFormat" data-key="exportFormat">
          <option value="epub">EPUB</option>
          <option value="pdf">PDF</option>
          <option value="txt">TXT</option>
          <option value="md">Markdown</option>
          <option value="html">HTML</option>
        </select>
      </div>
      <div class="field">
        <label for="chapterMode">章节划分</label>
        <select id="chapterMode" data-key="chapterMode">
          <option value="heading">按标题</option>
          <option value="page">每页一章</option>
          <option value="single">不分章</option>
        </select>
      </div>
    </div>
    <label class="check"><input type="checkbox" data-key="mergeAcrossPages" /> 合并被翻页截断的段落</label>
    <label class="check"><input type="checkbox" data-key="includeImages" /> 附带原始截图</label>
    <div class="actions">
      <button id="exportBtn" class="primary">导出</button>
      <button id="reocrFailedBtn">重新识别失败页</button>
      <button id="clearBtn" class="danger">清空</button>
    </div>
    <div id="pages"></div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="tab">
    <h3>智能体</h3>
    <div class="field">
      <label for="agent">使用的本机智能体</label>
      <select id="agent" data-key="agent"></select>
    </div>
    <div class="field">
      <label for="agentCommand">命令</label>
      <input id="agentCommand" placeholder="可执行文件名或完整路径" />
    </div>
    <div class="field">
      <label for="agentArgs">参数（JSON 数组）</label>
      <textarea id="agentArgs" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label for="agentStdin">写入 stdin 的内容（留空则不写）</label>
      <input id="agentStdin" spellcheck="false" />
      <small class="hint">占位符：{image} {prompt} {prompt_file} {out_file} {workdir}。若命令写入了 {out_file}，以该文件内容为结果，否则取 stdout。</small>
    </div>
    <div class="row">
      <div class="field"><label for="agentTimeoutSec">单次超时 (秒)</label><input id="agentTimeoutSec" data-key="agentTimeoutSec" type="number" min="10" /></div>
      <div class="field"><label for="ocrConcurrency">OCR 并发数</label><input id="ocrConcurrency" data-key="ocrConcurrency" type="number" min="1" max="8" /></div>
    </div>
    <div class="actions">
      <button id="resetAgentBtn">恢复该智能体默认命令</button>
      <button id="testAgentBtn">测试（OCR 当前视口）</button>
    </div>

    <h3>截屏工具</h3>
    <div class="field">
      <label for="toolEdit">编辑工具</label>
      <select id="toolEdit"></select>
    </div>
    <div id="toolFields">
      <div class="field"><label for="toolTrigger">唤起方式</label>
        <select id="toolTrigger">
          <option value="system">系统自带截屏</option>
          <option value="hotkey">发送全局快捷键</option>
          <option value="command">运行命令</option>
          <option value="browser">浏览器内置</option>
        </select>
      </div>
      <div class="field tool-hotkey"><label for="toolHotkey">快捷键（SendKeys 语法，如 {F1}、^+a）</label><input id="toolHotkey" /></div>
      <div class="field tool-command"><label for="toolCommand">命令（留空则自动查找常见安装位置）</label><input id="toolCommand" /></div>
      <div class="field tool-command"><label for="toolArgs">参数（JSON 数组）</label><input id="toolArgs" spellcheck="false" /></div>
      <div class="field tool-output"><label for="toolOutput">截图结果来源</label>
        <select id="toolOutput"><option value="clipboard">剪贴板</option><option value="file">输出文件 {out_file}</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label for="screenshotTimeoutSec">等待截图超时 (秒)</label><input id="screenshotTimeoutSec" data-key="screenshotTimeoutSec" type="number" min="5" /></div>
      <div class="field"><label for="sliceHeightPx">OCR 切片高度 (px)</label><input id="sliceHeightPx" data-key="sliceHeightPx" type="number" min="400" step="100" /></div>
    </div>
    <label class="check"><input type="checkbox" data-key="hideFixedAfterFirst" /> 滚动拼接时隐藏固定 / 吸顶元素</label>
    <div class="actions"><button id="testShotBtn">测试截屏工具</button></div>

    <h3>提示词</h3>
    <div class="field"><label for="ocrPrompt">OCR 提示词</label><textarea id="ocrPrompt" data-key="ocrPrompt" rows="8"></textarea></div>
    <div class="field"><label for="nextPrompt">下一页判断提示词</label><textarea id="nextPrompt" data-key="nextPrompt" rows="8"></textarea></div>
    <div class="actions"><button id="resetPromptsBtn">恢复默认提示词</button></div>

    <h3>本机 host</h3>
    <div class="actions"><button id="pingBtn">检测连接 / 可用工具</button></div>
    <pre id="hostInfo" class="mono"></pre>
  </section>

  <dialog id="previewDlg">
    <img id="previewImg" alt="" />
    <form method="dialog"><button>关闭</button></form>
  </dialog>
</body>
</html>
